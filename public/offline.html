<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A294A">
<title>Sem conexão</title>
<style>
  :root { --fundo: #1A294A; --cartao: #ffffff; --texto: #1A294A; --suave: #53648A; --alerta: #B83832; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: var(--fundo); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 16px; }
  main { background: var(--cartao); color: var(--texto); border-radius: 12px; max-width: 420px; width: 100%;
         padding: 24px; box-shadow: 0 8px 32px rgba(0,0,0,.35); }
  .faixa { background: var(--alerta); color: #fff; font-weight: 800; font-size: 13px; letter-spacing: .04em;
           text-transform: uppercase; border-radius: 8px; padding: 8px 12px; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 0 0 20px; color: var(--suave); line-height: 1.45; }
  a.botao { display: block; text-align: center; background: var(--texto); color: #fff; text-decoration: none;
            font-weight: 800; border-radius: 10px; padding: 14px; font-size: 16px; }
</style>
</head>
<body>
<main data-teste="pagina-offline">
  <div class="faixa">Sem conexão</div>
  <h1>Esta tela precisa de internet.</h1>
  <p>Volte ao Painel: os registros de campo continuam sendo guardados no aparelho e sobem sozinhos quando o sinal voltar.</p>
  <a class="botao" href="/dashboard/campo">Volte ao Painel</a>
</main>
</body>
</html>
